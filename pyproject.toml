[project]
name = "qapinn-spectra"
version = "1.1.1"
description = "Spectral-bias-aware quantum-classical hybrid PINNs via SMCD (Spectrum-Matched Circuit Design)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Katta Lahari" },
    { name = "Mannava Daasaradhi" },
]
keywords = [
    "physics-informed neural networks",
    "quantum machine learning",
    "variational quantum circuits",
    "spectral bias",
    "explainable AI",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.4",
    "pandas>=3.0.5",
    "pennylane>=0.45.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "torch>=2.11.0",
    "tqdm>=4.66.5",
]

[project.urls]
Repository = "https://github.com/Mannava-Daasaradhi/QAPINN_Spectra"
Paper = "https://github.com/Mannava-Daasaradhi/QAPINN_Spectra/blob/main/paper/main.pdf"
Findings = "https://github.com/Mannava-Daasaradhi/QAPINN_Spectra/blob/main/FINDINGS.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qapinn"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
