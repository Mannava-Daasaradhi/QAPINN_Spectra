[project]
name = "qapinn-spectra"
version = "0.1.0"
description = "Spectral-bias-aware quantum-classical hybrid PINNs via SMCD (Spectrum-Matched Circuit Design)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.4",
    "pandas>=3.0.5",
    "pennylane>=0.45.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "torch>=2.11.0",
    "tqdm>=4.66.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qapinn"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
